<body>

  <div id="sidebar">
    <a href="index.html">Accueil</a>
    <a href="learning.html">Apprentissage</a>
    <a href="quiz.html">Quiz</a>
    <a href="tournament.html">Tournoi</a>

  <div id="main">
    <h1>Apprentissage Pokémon</h1>

    <!-- Mode Buttons -->
    <!-- Directly display Names -->
    <div id="mode-buttons">
      <button id="mode-image">Image → Nom</button>
      <button id="mode-name">Nom → Image</button>
      <button id="direct-names">Afficher directement les noms</button>
    </div>

    <!-- Generation Selector -->
    <div id="gen-container">
      <label for="gen-select">Sélectionner la génération :</label>
      <select id="gen-select">
        <option value="all">Toutes les générations</option>
        <option value="Gen 1">Gen 1</option>
        <option value="Gen 2">Gen 2</option>
        <option value="Gen 3">Gen 3</option>
        <option value="Gen 4">Gen 4</option>
        <option value="Gen 5">Gen 5</option>
        <option value="Gen 6">Gen 6</option>
        <option value="Gen 7">Gen 7</option>
        <option value="Gen 8">Gen 8</option>
        <option value="Gen 9">Gen 9</option>
      </select>
    </div>

    <!-- Learning Card -->
    <div id="learning-card">
      <h2 id="pokemon-name"></h2>
      <img id="pokemon-image" src="" alt="">
    </div>

    <!-- Control Buttons -->
    <div id="control-buttons">
      <button id="previous">Précédent</button>
      <button id="next">Suivant</button>
      <button id="reveal">Révéler</button>
      <button id="known">Connu</button>
    </div>

    <!-- Progress Tracker -->
    <div id="progress">
      Appris : <span id="learned-count">0</span> / <span id="total-count">0</span>
    </div>
    <div id="progress-bar-container">
      <div id="progress-bar"></div>
    </div>
    <!-- Reset Progress Button -->
    <div id="reset-progress-container">
      <button id="reset-progress">Réinitialiser le progrès</button>
    </div>
    <footer>
  <p>Toutes les images et le contenu des Pokémon sont © Nintendo, Game Freak et The Pokémon Company. Ce site est non officiel et à des fins éducatives uniquement.</p>
</footer>

  </div>

  <script src="learning.js"></script>
</body>
</html>
