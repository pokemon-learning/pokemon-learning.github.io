<body>
    <div id="sidebar">
        <a href="index.html">Accueil</a>
        <a href="learning.html">Apprentissage</a>
        <a href="quiz.html">Quiz</a>
        <a href="tournament.html">Tournoi</a>
        <!-- <a href="about.html">À propos</a> -->
    </div>
    <div id="main"> 
        <h1>⚡ Tournoi Pokémon ⚡</h1>

        <div id="menu">
            <select id="gen-select">
                <option value="All">Toutes les générations</option>
                <option value="Gen 1">Gen 1</option>
                <option value="Gen 2">Gen 2</option>
                <option value="Gen 3">Gen 3</option>
                <option value="Gen 4">Gen 4</option>
                <option value="Gen 5">Gen 5</option>
                <option value="Gen 6">Gen 6</option>
                <option value="Gen 7">Gen 7</option>
                <option value="Gen 8">Gen 8</option>
                <option value="Gen 9">Gen 9</option>
            </select>

            <select id="difficulty-select">
                <option value="easy">Facile</option>
                <option value="medium" selected>Moyen</option>
                <option value="hard">Difficile</option>
            </select>
            <button onclick="createGame()">Créer une partie (Hôte)</button>
            <input id="join-code" placeholder="Entrer le code de participation">
            <button onclick="joinGame()">Rejoindre une partie</button>
        </div>

        <div id="game" style="display:none;">
        <h2 id="question"></h2>
        <div id="answers"></div>
        <style>
        #answers button {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 18px;
            cursor: pointer;
            background-color: #f8f9fa;
            border: 2px solid #ddd;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        /* This is the magic part you were missing! */
        #answers button.selected {
            background-color: #4CAF50; /* Green */
            color: white;
            border-color: #2E7D32;
            transform: scale(1.02);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        #timer {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
        }
        </style>
        <div id="timer"></div>
        <div id="leaderboard"></div>
        </div>


        <button id="start-btn" onclick="startTournament()" style="display:none;">
        🚀 Start Tournament
        </button>
            <footer>
  <p>Toutes les images et le contenu des Pokémon sont © Nintendo, Game Freak et The Pokémon Company. Ce site est non officiel et à des fins éducatives uniquement.</p>
</footer>
    </div>
