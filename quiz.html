<body>

  <div id="sidebar">
    <a href="index.html">Accueil</a>
    <a href="learning.html">Apprentissage</a>
    <a href="quiz.html">Quiz</a>
    <a href="tournament.html">Tournoi</a>
    <!-- <a href="about.html">À propos</a> -->
  </div>

  <div id="main">
    <h1>Quiz Pokémon</h1>

    <!-- Quiz Settings -->
    <div id="quiz-settings">
      <label for="quiz-gen-select">Sélectionner la génération :</label>
      <select id="quiz-gen-select">
        <option value="all">Toutes les générations</option>
        <option value="Gen 1">Gen 1</option>
        <option value="Gen 2">Gen 2</option>
        <option value="Gen 3">Gen 3</option>
        <option value="Gen 4">Gen 4</option>
        <option value="Gen 5">Gen 5</option>
        <option value="Gen 6">Gen 6</option>
        <option value="Gen 7">Gen 7</option>
        <option value="Gen 8">Gen 8</option>
        <option value="Gen 9">Gen 9</option>
      </select>

      <label for="num-questions">Nombre de questions :</label>
      <input type="number" id="num-questions" value="10" min="1" max="100">

      <button id="start-quiz">Commencer le Quiz</button>
    </div>

    <!-- Quiz Card -->
    <div id="quiz-card" style="display:none;">
      <div class="image-container">
        <h2 id="quiz-pokemon-name"></h2>
        <img id="quiz-pokemon-image" src="" alt="Pokemon">
      </div>
      <input type="text" id="quiz-answer" placeholder="Tapez le nom du Pokémon" style="margin: 20px auto; display: block;">
      <button id="submit-answer">Soumettre</button>

      <p id="quiz-feedback"></p>
      <p id="quiz-progress"></p>
    </div>

    <!-- Quiz Result -->
    <div id="quiz-result" style="display:none;">
      <h2>Quiz Terminé !</h2>
      <p id="quiz-score"></p>
      <button id="restart-quiz">Recommencer le Quiz</button>
    </div>
    <footer>
  <p>Toutes les images et le contenu des Pokémon sont © Nintendo, Game Freak et The Pokémon Company. Ce site est non officiel et à des fins éducatives uniquement.</p>
</footer>

  </div>

  <script src="quiz.js"></script>
</body>
</html>
